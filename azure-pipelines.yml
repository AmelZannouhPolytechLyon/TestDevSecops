# Déclenche le pipeline automatiquement lors d'un changement sur la branche master
trigger:
 branches:
    include:
    - master
    - test/*

# Utilise un agent Microsoft Ubuntu pour exécuter le pipeline
pool:
  vmImage: 'ubuntu-latest'

# Configuration utilisée pour compiler l'application
variables:
  buildConfiguration: 'Release'

steps:

# Récupère le code source du dépôt
- checkout: self

# Installe le SDK .NET 10 sur l'agent
- task: UseDotNet@2
  displayName: 'Installer .NET 10'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# Affiche la version .NET utilisée dans les logs du pipeline
- script: dotnet --version
  displayName: 'Vérifier la version .NET'

# Restaure les packages NuGet nécessaires à la solution
- task: DotNetCoreCLI@2
  displayName: 'Restaurer les dépendances'
  inputs:
    command: 'restore'
    projects: '**/*.slnx'

# Compile la solution en mode Release
- task: DotNetCoreCLI@2
  displayName: 'Compiler la solution'
  inputs:
    command: 'build'
    projects: '**/*.slnx'
    arguments: '--configuration $(buildConfiguration) --no-restore'


# -----------------------------
# SAST - Semgrep
# -----------------------------

# Installe Semgrep sur l'agent Azure DevOps
- script: |
    python -m pip install --upgrade pip
    python -m pip install semgrep
  displayName: 'Installer Semgrep'

# Analyse le même code source et génère un rapport JSON
- script: |
    semgrep scan --config p/csharp --json --output=semgrep-results.json .
  displayName: 'Analyser le code avec Semgrep'

# Conserve le rapport Semgrep comme preuve du PoC
- task: PublishPipelineArtifact@1
  displayName: 'Publier le rapport Semgrep'
  inputs:
    targetPath: 'semgrep-results.json'
    artifact: 'Semgrep-SAST'