name: OWASP Dependency-Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installe .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Restaure les dépendances NuGet
      - name: Restore NuGet dependencies
        run: dotnet restore

      # Affiche notre baseline NuGet
      - name: NuGet vulnerability baseline
        run: dotnet list package --vulnerable --include-transitive

      # Lance OWASP Dependency-Check
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'TestDevSecops'
          path: '.'
          format: 'ALL'
          out: 'dependency-check-report'
          args: >
            --failOnCVSS 7

      # Publie toujours les rapports, même si CVSS >= 7
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report
